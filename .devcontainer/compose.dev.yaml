services:
  cli:
    build:
      context: ..
      dockerfile: .docker/images/dev/cli/Dockerfile
    working_dir: /workspaces/laravel
    volumes:
      - ..:/workspaces/laravel
    command: sleep infinity
    networks:
      app: {}

  fpm:
    build:
      context: ..
      dockerfile: .docker/images/fpm/Dockerfile
      target: dev-fpm
    volumes:
      - ..:/var/www/html
    user: "1000:1000"

  queue:
    build:
      context: ..
      dockerfile: .docker/images/fpm/Dockerfile
      target: dev-fpm
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --queue=mail,discord-message,player-mail,default
    restart: unless-stopped
    volumes:
      - ..:/var/www/html
    user: "1000:1000"

  scheduler:
    build:
      context: ..
      dockerfile: .docker/images/fpm/Dockerfile
      target: dev-fpm
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - ..:/var/www/html
    user: "1000:1000"

  nginx:
    build:
      context: ..
      dockerfile: .docker/images/fpm/Dockerfile
      target: dev-nginx
    ports:
      - "80:80"
    volumes:
      - ..:/var/www/html

  mariadb:
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - ../.docker/images/dev/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-pcb-web}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    command: /data
    ports:
      - "${FORWARD_RUSTFS_PORT:-9000}:9000"
      - "${FORWARD_RUSTFS_CONSOLE_PORT:-8900}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      retries: 3
      timeout: 5s
    networks:
      app: {}

  mailpit:
    image: axllent/mailpit:v1.27.11
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      app: {}

  stripe-cli:
    image: stripe/stripe-cli:v1.37.1
    profiles:
      - stripe
    command:
      - listen
      - --api-key
      - ${STRIPE_SECRET}
      - --device-name=${STRIPE_CLI_DEVICE_NAME}
      - --forward-to
      - http://nginx/stripe/webhook/
    depends_on:
      - nginx
    networks:
      app: {}

volumes:
  rustfs-data:
