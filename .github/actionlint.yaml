# TODO: Delete this file once actionlint supports the $/ self-repository syntax
# https://github.com/rhysd/actionlint/issues/760
paths:
  .github/workflows/deploy-production.yml:
    ignore:
      - '^reusable workflow call "\$/\.github/workflows/[^"/]+\.yml" at "uses" is not following the format'
  .github/workflows/deploy-staging.yml:
    ignore:
      - '^reusable workflow call "\$/\.github/workflows/[^"/]+\.yml" at "uses" is not following the format'
  .github/workflows/__deploy.yml:
    ignore:
      - '^reusable workflow call "\$/\.github/workflows/[^"/]+\.yml" at "uses" is not following the format'
