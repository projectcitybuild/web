name: Install Composer Dependencies
description: Downloads Composer dependencies from cache or CDN

runs:
  using: composite
  steps:
    - name: Prepare Composer cache directory
      shell: bash
      run: mkdir -p .cache/composer

    - name: Restore Composer cache
      id: composer-cache
      uses: actions/cache@v6.1.0
      with:
        path: .cache/composer
        key: ${{ runner.os }}-composer-v4-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install Composer dependencies
      uses: $/.github/actions/run-in-devcontainer
      with:
        command: |
          git config --global --add safe.directory /workspaces/laravel
          php -r 'printf("PHP binary: %s; PDO loaded: %s\\n", PHP_BINARY, class_exists(PDO::class) ? "yes" : "no"); if (!class_exists(PDO::class)) { exit(1); }'
          composer --version
          COMPOSER_ALLOW_SUPERUSER=1 COMPOSER_CACHE_DIR=/workspaces/laravel/.cache/composer composer install --prefer-dist --ignore-platform-reqs --no-interaction
