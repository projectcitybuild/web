name: Install NPM Dependencies
description: Downloads NPM dependencies from cache or CDN

runs:
  using: composite
  steps:
    - name: Prepare npm cache directory
      shell: bash
      run: mkdir -p .cache/npm

    - name: Restore npm cache
      id: npm-cache
      uses: actions/cache@v6.1.0
      with:
        path: .cache/npm
        key: ${{ runner.os }}-node-v4-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install npm dependencies
      uses: $/.github/actions/run-in-devcontainer
      with:
        command: npm_config_cache=/workspaces/laravel/.cache/npm npm ci
