name: Unit Tests

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  unit-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
            persist-credentials: false

      - name: Start devcontainer
        uses: $/.github/actions/start-devcontainer
        with:
          services: cli mariadb redis

      - name: Install Composer dependencies
        uses: $/.github/actions/install-composer-deps

      - name: Install npm dependencies
        uses: $/.github/actions/install-npm-deps

      - name: Typecheck frontend
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: npm run typecheck

      - name: Calculate front-end asset hash
        id: get-assets-cache
        uses: theowenyoung/folder-hash@v3
        with:
          path: |
            resources/js
            resources/css
            public

      - name: Restore front-end asset cache
        id: assets-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            resources/js
            resources/css
            public
          key: ${{ runner.os }}-assets-v1-${{ steps.get-assets-cache.outputs.hash }}-${{ hashFiles('package-lock.json') }}

      - name: Build front-end assets
        if: steps.assets-cache.outputs.cache-hit != 'true'
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: npm run build

      - name: Prepare Laravel
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: php artisan key:generate && chmod -R 755 storage bootstrap/cache

      - name: Generate TypeScript declarations
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: php artisan typescript:transform

      - name: Check TypeScript declarations are up to date
        run: git diff --exit-code -- resources/js/generated/generated.d.ts resources/js/generated/typescript-transformer-manifest.json

      - name: Reject weak generated data types
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: |
            if grep -Eq 'Array<any>|Record<string, any>' resources/js/generated/generated.d.ts; then
              echo "Generated declarations contain weak any types."
              exit 1
            fi

      - name: Prepare database
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: php artisan migrate

      - name: Run tests
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: |
            XDEBUG_MODE=coverage php artisan test \
              --log-junit junit.xml \
              --coverage-clover=coverage.xml

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: junit.xml
          report_type: test_results

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          report_type: coverage

      - name: Stop devcontainer
        if: always()
        run: docker compose -f .devcontainer/compose.yaml down --volumes

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_ACTIONS_PAT }} # Allows workflows to trigger from the resulting commit
          persist-credentials: false

      - name: Start devcontainer
        uses: $/.github/actions/start-devcontainer
        with:
          services: cli

      - name: Install Composer dependencies
        uses: $/.github/actions/install-composer-deps

      - name: Run Pint
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: vendor/bin/pint

      - name: Stop devcontainer
        if: always()
        run: docker compose -f .devcontainer/compose.yaml down --volumes
