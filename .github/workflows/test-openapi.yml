name: OpenAPI

on:
  push:
    paths:
      - routes/**
      - app/Http/Controllers/Api/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Start devcontainer
        uses: $/.github/actions/start-devcontainer
        with:
          services: cli mariadb redis

      - name: Install Composer dependencies
        uses: $/.github/actions/install-composer-deps

      - name: Prepare Laravel
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: php artisan key:generate && chmod -R 755 storage bootstrap/cache

      - name: Prepare database
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: php artisan migrate

      - name: Generate OpenAPI specification
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: php artisan scramble:export --path=public/api.json

      - name: Stop devcontainer
        if: always()
        run: docker compose -f .devcontainer/compose.yaml down --volumes
