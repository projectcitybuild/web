name: Security - Static Analysis

on:
  pull_request:
  push:

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@v2.2.0
        with:
          # actionlint doesn't support the $/ Action reference format yet
          # https://github.com/rhysd/actionlint/issues/711
          flags: '-ignore specifying\saction\s\x22\$/.+\x22\sinvalid\sformat\sbecause\sref\sis\smissing'

  semgrep:
    name: semgrep-oss/scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Run Semgrep
        # Semgrep doesn't understand the $/ Action reference format
        run: semgrep scan --config auto --error --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
