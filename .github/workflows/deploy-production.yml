name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      major:
        description: Major version
        default: 0
        required: true
        type: number
      minor:
        description: Minor version
        default: 0
        required: true
        type: number
      patch:
        description: Patch version
        default: 0
        required: true
        type: number
      image-tag:
        description: Existing image tag to promote; leave empty to build and deploy main directly
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    uses: $/.github/workflows/__deploy.yml
    permissions:
      contents: read
      packages: write
    secrets:
      DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    with:
      environment: production
      branch: main
      image-tag: ${{ inputs.image-tag }}
      build-images: ${{ inputs.image-tag == '' }}

  tag:
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.deploy.outputs.image-tag }}
          fetch-depth: 0

      - name: Determine version tag
        id: git_tag
        env:
          VERSION_MAJOR: ${{ inputs.major }}
          VERSION_MINOR: ${{ inputs.minor }}
          VERSION_PATCH: ${{ inputs.patch }}
        run: |
          VERSION_TAG="v${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          echo "Input version: $VERSION_TAG"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Create a new tag
        env:
          VERSION_TAG: ${{ steps.git_tag.outputs.VERSION_TAG }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

      - name: Generate release notes from commits
        env:
          VERSION_TAG: ${{ steps.git_tag.outputs.VERSION_TAG }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          PREVIOUS_TAGS=$(git tag --merged "$VERSION_TAG^" --list 'v[0-9]*')
          if [ -n "$PREVIOUS_TAGS" ]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$VERSION_TAG^")
            echo "## Changes since $PREVIOUS_TAG" > "$NOTES_FILE"
            COMMIT_RANGE="$PREVIOUS_TAG..$VERSION_TAG"
          else
            echo "## Changes" > "$NOTES_FILE"
            COMMIT_RANGE="$VERSION_TAG"
          fi
          git log --no-merges --format='%s%x09%h%x09%H' "$COMMIT_RANGE" |
            awk -F '\t' -v repository="$GITHUB_REPOSITORY" '
              function commit_type(subject, type) {
                if (match(subject, /^[[:alnum:]][[:alnum:]._-]*(\([^)]*\))?!?:/)) {
                  type = substr(subject, 1, RLENGTH)
                  sub(/:.*/, "", type)
                  sub(/!$/, "", type)
                  sub(/\([^)]*\)$/, "", type)
                  return tolower(type)
                }
                return "other"
              }
              {
                type = commit_type($1)
                if (!(type in seen)) {
                  seen[type] = 1
                  types[++type_count] = type
                }
                commits[type] = commits[type] "- " $1 " ([" $2 "](https://github.com/" repository "/commit/" $3 "))\n"
              }
              END {
                for (i = 1; i <= type_count; i++) {
                  type = types[i]
                  heading = type == "other" ? "Other" : type
                  printf "### %s\n%s", heading, commits[type]
                }
              }
            ' >> "$NOTES_FILE"

      - name: Create a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.git_tag.outputs.VERSION_TAG }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: gh release create "$VERSION_TAG" --title "$VERSION_TAG" --notes-file "$NOTES_FILE"
