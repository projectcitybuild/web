name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      major:
        description: Major version
        default: 0
        required: true
        type: number
      minor:
        description: Minor version
        default: 0
        required: true
        type: number
      patch:
        description: Patch version
        default: 0
        required: true
        type: number
      image-tag:
        description: Existing image tag to promote; leave empty to build and deploy main directly
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/__deploy.yml
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
    with:
      environment: production
      branch: main
      image-tag: ${{ inputs.image-tag }}
      build-images: ${{ inputs.image-tag == '' }}

  tag:
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.deploy.outputs.image-tag }}

      - name: Determine version tag
        id: git_tag
        env:
          VERSION_MAJOR: ${{ inputs.major }}
          VERSION_MINOR: ${{ inputs.minor }}
          VERSION_PATCH: ${{ inputs.patch }}
        run: |
          VERSION_TAG="v${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          echo "Input version: $VERSION_TAG"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Create a new tag
        env:
          VERSION_TAG: ${{ steps.git_tag.outputs.VERSION_TAG }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

      - name: Create a GitHub Release
        uses: softprops/action-gh-release@1fd6f3f2b1b859145679a1892abda586ef982a84
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.git_tag.outputs.VERSION_TAG }}
          name: ${{ steps.git_tag.outputs.VERSION_TAG }}
          generate_release_notes: true
