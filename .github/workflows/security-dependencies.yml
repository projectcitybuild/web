name: Security - Dependency Audit

on:
  pull_request:
  schedule:
    - cron: '13 6 * * 1'

permissions:
  contents: read

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Start devcontainer
        uses: $/.github/actions/start-devcontainer
        with:
          services: cli

      - name: Audit Composer dependencies
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: composer audit --locked

      - name: Stop devcontainer
        if: always()
        run: docker compose -f .devcontainer/compose.yaml down --volumes

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Start devcontainer
        uses: $/.github/actions/start-devcontainer
        with:
          services: cli

      - name: Audit npm dependencies
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: npm audit --package-lock-only

      - name: Stop devcontainer
        if: always()
        run: docker compose -f .devcontainer/compose.yaml down --volumes
