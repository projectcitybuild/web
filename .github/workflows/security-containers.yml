name: Security - Container Scanning

on:
  pull_request:
  push:
  schedule:
    - cron: '21 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Scan ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production-fpm
            target: fpm
          - name: production-nginx
            target: nginx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: .docker/images/fpm/Dockerfile
          target: ${{ matrix.target }}
          tags: local/pcb-web:${{ matrix.name }}
          load: true

      - name: Scan ${{ matrix.name }} image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/pcb-web:${{ matrix.name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
