name: Deploy

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      environment:
        required: true
        type: string
      image-tag:
        required: false
        type: string
      build-images:
        required: true
        type: boolean
    secrets:
      GITHUB_TOKEN:
        required: true
      DEPLOY_PRIVATE_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_PATH:
        required: true
      GHCR_USERNAME:
        required: true
      GHCR_PULL_TOKEN:
        required: true
    outputs:
      image-tag:
        description: Commit SHA used to tag the deployed images
        value: ${{ jobs.deploy.outputs.image-tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.source.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.image-tag || inputs.branch }}

      - name: Determine source revision
        id: source
        run: echo "image-tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Start devcontainer
        uses: $/.github/actions/start-devcontainer
        with:
          services: cli mariadb redis

      - name: Install Composer dependencies
        uses: $/.github/actions/install-composer-deps

      - name: Install npm dependencies
        uses: $/.github/actions/install-npm-deps

      - name: Prepare Laravel
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: php artisan key:generate && chmod -R 755 storage bootstrap/cache

      - name: Run database migrations
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: php artisan migrate

      - name: Build frontend assets
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: npm run build

      - name: Run test suite
        uses: $/.github/actions/run-in-devcontainer
        with:
          command: XDEBUG_MODE=coverage php artisan test

      - name: Stop devcontainer
        if: always()
        run: docker compose -f .devcontainer/compose.yaml down --volumes

  build:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    outputs:
      image-repo: ${{ steps.repository.outputs.image-repo }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.verify.outputs.image-tag }}

      - name: Set image repository
        id: repository
        run: |
          IMAGE_REPO="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPO=$IMAGE_REPO" >> "$GITHUB_ENV"
          echo "image-repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: inputs.build-images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push PHP-FPM image
        if: inputs.build-images
        env:
          IMAGE_TAG: ${{ needs.verify.outputs.image-tag }}
        run: >-
          docker buildx build --push --file .docker/images/fpm/Dockerfile --target fpm
          --tag "$IMAGE_REPO:$IMAGE_TAG-fpm"
          --label "org.opencontainers.image.revision=$IMAGE_TAG" .

      - name: Build and push nginx image
        if: inputs.build-images
        env:
          IMAGE_TAG: ${{ needs.verify.outputs.image-tag }}
        run: >-
          docker buildx build --push --file .docker/images/fpm/Dockerfile --target nginx
          --tag "$IMAGE_REPO:$IMAGE_TAG-nginx"
          --label "org.opencontainers.image.revision=$IMAGE_TAG" .

      - name: Log out of GitHub Container Registry
        if: always() && inputs.build-images
        run: docker logout ghcr.io || true

  deploy:
    runs-on: ubuntu-latest
    needs: [verify, build]
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      image-tag: ${{ needs.verify.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.verify.outputs.image-tag }}

      - name: Prepare SSH
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/key" "$RUNNER_TEMP/deploy-ssh/known_hosts"

      - name: Deploy blue-green release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ needs.verify.outputs.image-tag }}
          IMAGE_REPO: ${{ needs.build.outputs.image-repo }}
        run: |
          [[ "$APP_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_options=(-i "$RUNNER_TEMP/deploy-ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" -o StrictHostKeyChecking=yes)

          release_path="$DEPLOY_PATH/$ENVIRONMENT/$IMAGE_TAG"
          printf '%s\n' "$release_path" | ssh "${ssh_options[@]}" "$target" \
            "IFS= read -r release_path && mkdir -p -- \"\$release_path\""
          scp "${ssh_options[@]}" \
            .docker/compose.yaml \
            .docker/deployment/compose.server.yaml \
            .docker/images/proxy/proxy-compose.yaml \
            .docker/images/proxy/Caddyfile \
            .docker/deployment/deploy.sh \
            .docker/deployment/restart.sh \
            "$target:$release_path/"

          printf '%s' "$GHCR_PULL_TOKEN" | ssh "${ssh_options[@]}" "$target" \
            docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

          deploy_status=0
          printf '%s\n' "$release_path/deploy.sh" "$ENVIRONMENT" "$IMAGE_TAG" "$APP_DOMAIN" "$IMAGE_REPO" "$release_path" |
            ssh "${ssh_options[@]}" "$target" \
              "IFS= read -r deploy_script && IFS= read -r environment && IFS= read -r image_tag && IFS= read -r app_domain && IFS= read -r image_repo && IFS= read -r release_path && sh \"\$deploy_script\" \"\$environment\" \"\$image_tag\" \"\$app_domain\" \"\$image_repo\" \"\$release_path\"" || deploy_status=$?
          ssh "${ssh_options[@]}" "$target" docker logout ghcr.io || true
          exit "$deploy_status"

      - name: Publish deployed image revision
        run: 'echo "Deployed image revision: ${{ needs.verify.outputs.image-tag }}" >> "$GITHUB_STEP_SUMMARY"'

